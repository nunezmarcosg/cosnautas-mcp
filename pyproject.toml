[project]
name = "cosnautas-mcp"
version = "1.0.0"
description = "Servidor MCP remoto (streamable HTTP) para consultar Cosnautas"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
